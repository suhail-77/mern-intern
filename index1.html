<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>System Status</title>
</head>

<body>
    <h2 id="statusBanner">System Status</h2>
    <button id="checkButton">Check System Status</button>
    <script>
        alert("Welcome to the System Status Checker!");
        const statusBanner = document.getElementById("statusBanner");
        const checkButton = document.getElementById("checkButton");
        const updateBanner = (message, color) => {
            statusBanner.innerText = message;
            statusBanner.style.backgroundColor = color;
        };
        const checkStatus = () => {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const isOnline = Math.random() >= 0.5;
                    if (isOnline) {
                        resolve("Online");
                    } else {
                        resolve("Offline");
                    }
                }, 2000);
            });
        };
        checkButton.addEventListener("click", () => {
            updateBanner("System is Checking...", "yellow");
            checkStatus().then((status) => {
                if (status === "Online") {
                    updateBanner("System is Online", "green");
                } else {
                    updateBanner("System is Offline", "red");
                }
            });
        });
    </script>
</body>

</html>
