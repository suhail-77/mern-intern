<!DOCTYPE html>
<html>

<head>
    <title>
        MERN STACK
    </title>
</head>

<body>
    <h1 id="L">BATMAN</h1>
    <p class="title">Welcome to CSBS</p>
    <h3 class="name">DC</h3>
    <h3 class="name">MARVEL</h3>
    <h3 class="name">SONY</h3>
    <h3 class="name">XMEN</h3>
    <button id="btn">Click Me</button>
    <h4 id="h4">button color changed</h4>
    <button id="btn1">Click Me</button>
    <h5 id="text"></h5>

</body>
<script>
    document.getElementById("L").style.color = "green";

    let elements = document.getElementsByClassName("title")
    for (let i = 0; i < elements.length; i++) {
        elements[i].style.backgroundColor = "red"
        elements[i].style.fontSize = "50px";
    }

    let s1 = document.querySelectorAll(".name")
    s1[0].innerHTML = "superman";
    s1.forEach((element) => {
        element.style.color = "red"
    })


    let s = document.querySelector(".name")
    s.style.color = "blue"
    let button = document.getElementById("btn")
    button.addEventListener("click", () => {
        alert("Button Clicked")
        document.getElementById("h4").style.color = "red"
    })

    let elem1 = document.getElementById("btn1")
    elem1.addEventListener("dblclick", () => {
        document.getElementById("text").innerHTML = "wertrewq"
    })
</script>

</html>
